name: Spotify import Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Test history parser, migration and large archives
        run: >-
          ./gradlew --no-daemon :core:testDebugUnitTest
          --tests '*SpotifyHistoryParserTest'
          --tests '*HistoryDatabaseTest'
          --tests '*AccountHistoryMergeTest'
          --tests '*WrappedTest'
      - name: Test launcher icon selection
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests '*AppIconTest'
      - name: Build installable Android APK
        run: ./gradlew --no-daemon :app:assembleDebug -PuniversalOnly=true
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-Spotify-Stats-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
