name: Spotify import Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Test history parser, migration and large archives
        run: >-
          ./gradlew --no-daemon :core:testDebugUnitTest
          --tests '*SpotifyHistoryParserTest'
          --tests '*HistoryDatabaseTest'
          --tests '*AccountHistoryMergeTest'
          --tests '*WrappedTest'
          --tests '*StatisticsIdentityTest'
          --tests '*UpdateCheckTest'
      - name: Test launcher icon selection
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests '*AppIconTest'
      - name: Build installable Android APK
        run: ./gradlew --no-daemon :app:assembleDebug -PuniversalOnly=true
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-Spotify-Stats-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build optimized side-by-side preview
        run: ./gradlew --no-daemon :app:assembleRelease -PuniversalOnly=true -PstatsPreview=true
      - name: Upload optimized preview
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-Spotify-Stats-optimized-preview
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OpenTune-Spotify-Stats-debug-apk
          path: android-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and restart with 100,000 listens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/check-android-history.sh
      - name: Save emulator observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-history-emulator-observations
          path: |
            ${{ runner.temp }}/opentune-history-smoke/screen.png
            ${{ runner.temp }}/opentune-history-smoke/gfxinfo.txt
            ${{ runner.temp }}/opentune-history-smoke/logcat.txt
          if-no-files-found: ignore
