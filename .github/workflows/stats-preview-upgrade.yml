name: Signed Stats preview update
on:
  push:
    branches: ['artifacts/stats-preview-*']
permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - name: Verify preview and previous stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous
          tools="$ANDROID_HOME/build-tools/36.0.0"
          expected=0dca64e0eba5a42e19998d68446f8c70dd14fe5e448381db6da8f1bcabb1718a
          (cd signed-release && sha256sum -c SHA256SUMS.txt)
          for apk in previous/*.apk signed-release/*.apk; do
            signer=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            [[ "$signer" == "$expected" ]]
            "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/preview-manifest.txt"
            grep -F "package: name='com.opentune.spotifystats'" "$RUNNER_TEMP/preview-manifest.txt"
          done
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install stable, update in place and measure launches on the same emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/check-stats-upgrade.sh previous/*.apk signed-release/*.apk observations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stats-update-emulator-observations
          path: observations/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTune-Stats-signed-update
          path: signed-release/
          if-no-files-found: error
          retention-days: 30
